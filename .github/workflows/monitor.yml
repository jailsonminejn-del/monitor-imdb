name: Monitorar notas IMDb

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Verificar notas
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py

      - name: Salvar estado
        run: |
          git config user.name "IMDb Monitor"
          git config user.email "imdb-monitor@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || git commit -m "Atualizar notas IMDb"
          git push
